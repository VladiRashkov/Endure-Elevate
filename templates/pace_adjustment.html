<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pace Adjustment</title>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens (same as login + home) ---------- */
  :root {
    --brand:       #0b5c7e;
    --brand-deep:  #073b52;
    --brand-mid:   #0e6d94;
    --ink:         #12262f;
    --muted:       #55707c;
    --line:        #cfdde3;
    --page:        #f5f8fa;
    --tint:        #e4eff4;
    --error:       #b3261e;
    --error-bg:    #fdeceb;

    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body:    "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--page);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 clamp(20px, 4vw, 40px);
  }

  /* ---------- Header band ---------- */
  .band {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    color: #fff;
    background: linear-gradient(160deg, var(--brand-deep) 0%, var(--brand) 65%, var(--brand-mid) 100%);
    padding-bottom: clamp(28px, 5vw, 48px);
  }
  .contours {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: -1;
    fill: none; stroke: #fff; stroke-width: 1; stroke-opacity: .13;
    animation: fade-in 1.6s ease-out both;
  }
  .contours .major { stroke-opacity: .28; stroke-width: 1.4; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0 clamp(20px, 3vw, 32px);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    color: inherit; text-decoration: none;
    font-family: var(--font-display);
    font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; white-space: nowrap;
  }
  .brand:focus-visible { outline: 3px solid rgba(255,255,255,.8); outline-offset: 4px; border-radius: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: #fff; color: var(--brand);
    display: grid; place-items: center;
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 0 0 14px -4px; padding: 4px 8px 4px 4px;
    color: rgba(255,255,255,.85); font-weight: 500; font-size: .95rem;
    text-decoration: none; border-radius: 8px;
  }
  .back:hover { color: #fff; background: rgba(255,255,255,.12); }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 4.5vw, 3rem);
    letter-spacing: -.025em;
    line-height: 1.05;
  }

  /* ---------- User menu ---------- */
  .user { position: relative; }
  .user-btn {
    display: flex; align-items: center; gap: 10px;
    height: 42px; padding: 0 12px 0 6px;
    font: inherit; font-size: .95rem; font-weight: 500; color: #fff;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    cursor: pointer;
    transition: background-color .15s;
  }
  .user-btn:hover, .user-btn[aria-expanded="true"] { background: rgba(255,255,255,.22); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #fff; color: var(--brand);
    display: grid; place-items: center;
    font-weight: 600; font-size: .9rem;
  }
  .user-name { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { transition: transform .15s; }
  .user-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px);
    min-width: 170px; padding: 6px;
    background: #fff; color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(7, 59, 82, .18);
    z-index: 10;
  }
  .menu[hidden] { display: none; }
  .menu a {
    display: block; padding: 10px 12px;
    color: var(--ink); font-weight: 500; text-decoration: none; border-radius: 8px;
  }
  .menu a:hover { background: var(--page); }

  /* ---------- Pace table ---------- */
  .meta {
    display: inline-flex; align-items: baseline; gap: 8px;
    margin: 14px 0 0; padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.22);
    font-size: .9rem; font-weight: 500;
  }
  .meta strong { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: -.01em; }

  .lead { margin: 32px 0 14px; color: var(--muted); font-size: 1rem; line-height: 1.5; }
  main { padding-bottom: 56px; }

  .card {
    max-width: 480px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    overflow: clip;            /* rounds the corners without breaking the sticky header */
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    position: sticky; top: 0; z-index: 1;
    padding: 14px 20px;
    text-align: left; white-space: nowrap;
    font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted);
    background: var(--page);
    border-bottom: 1px solid var(--line);
  }
  td { padding: 8px 20px; border-bottom: 1px solid #e6eef2; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fafcfd; }
  tbody tr:focus-within { background: #f0f7fa; }
  .km { width: 110px; font-weight: 600; color: var(--muted); }
  .empty { padding: 28px 20px; text-align: center; color: var(--muted); }

  input[type="text"] {
    width: 140px; height: 42px; padding: 0 12px;
    font: inherit; font-size: 1rem; font-weight: 500; color: var(--brand);
    text-align: center;
    background: #fff;
    border: 1.5px solid var(--line); border-radius: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #93a7b0; font-weight: 400; }
  input:hover { border-color: #b3c7d0; }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(11, 92, 126, .16); }

  a:focus-visible, button:focus-visible {
    outline: 3px solid rgba(11, 92, 126, .55); outline-offset: 2px;
  }
  .band a:focus-visible, .band button:focus-visible { outline-color: rgba(255,255,255,.8); }

  @media (max-width: 640px) {
    .user-name { display: none; }
    .user-btn { padding-right: 10px; }
    .km { width: 84px; }
    th, td { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .contours { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

  <div class="wrap">
    <div class="bar">
      <a class="brand" href="{{ url_for('token.back_to_panel') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 10 7l4 7 3-4 4 9z"/></svg>
        </span>
        Endure &amp; Elevate
      </a>

      <div class="user">
        <button class="user-btn" id="user-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="user-menu">
          <span class="avatar" aria-hidden="true">{{ (user_name or 'U')[0]|upper }}</span>
          <span class="user-name">{{ user_name }}</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu" id="user-menu" hidden>
          <a href="{{ url_for('user.logout') }}">Log out</a>
        </div>
      </div>
    </div>

    <a class="back" href="/calculate/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      Back to planner
    </a>
    <h1>Pace adjustment</h1>
    <p class="meta"><span>Distance</span> <strong>{{ distance }} km</strong></p>
  </div>
</header>

<main class="wrap">
  <p class="lead">Edit any kilometer to adjust your plan.</p>

  <form id="paceForm" class="card" onsubmit="return false">
    <table>
      <thead>
        <tr>
          <th>Kilometer</th>
          <th>Pace (MM:SS)</th>
        </tr>
      </thead>
      <tbody id="paceTable">
        {% for km, pace in pace_data.items() %}
        <tr>
          <td class="km">{{ km }}</td>
          <td>
            <input type="text"
                   name="pace_{{ km }}"
                   value="{{ pace }}"
                   data-km="{{ km }}"
                   placeholder="mm:ss"
                   aria-label="Pace for kilometer {{ km }}"
                   autocomplete="off" spellcheck="false">
          </td>
        </tr>
        {% else %}
        <tr><td class="empty" colspan="2">No pace data.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </form>
</main>

<script>
  const btn = document.getElementById('user-btn');
  const menu = document.getElementById('user-menu');
  function setOpen(open) { btn.setAttribute('aria-expanded', String(open)); menu.hidden = !open; }
  btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(menu.hidden); });
  document.addEventListener('click', (e) => { if (!menu.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); }
  });
</script>
</body>
</html>
